name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup XcodeGen
      run: |
        brew install xcodegen
    
    - name: Generate Xcode Project
      run: |
        xcodegen generate
    
    - name: Build
      run: |
        xcodebuild -project BasicIOSApp.xcodeproj -scheme BasicIOSApp -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -derivedDataPath build build
    
    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/BasicIOSApp.app Payload/
        zip -r BasicIOSApp.ipa Payload
        rm -rf Payload
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: BasicIOSApp.ipa
        path: BasicIOSApp.ipa
