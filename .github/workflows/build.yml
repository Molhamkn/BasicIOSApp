name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup XcodeGen and CocoaPods
      run: |
        brew install xcodegen
        gem install cocoapods
    
    - name: Generate Xcode Project and Install Pods
      run: |
        xcodegen generate
        pod install
    
    - name: Build for Device
      run: |
        xcodebuild -workspace BasicIOSApp.xcworkspace -scheme BasicIOSApp -configuration Release -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -derivedDataPath build build
    
    - name: Create IPA
      run: |
        APP_PATH=$(find build -name "*.app" -type d | head -1)
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        zip -r BasicIOSApp.ipa Payload
        rm -rf Payload
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: BasicIOSApp.ipa
        path: BasicIOSApp.ipa
